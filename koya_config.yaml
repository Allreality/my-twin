# Koya Operations Configuration
# Total Reality Global - Western Rural District Node
# Identity: Pa Santige Koroma (Temne)
# Location: Koya, Western Rural District, Sierra Leone

service:
  name: koya-operations
  port: 5006
  version: "1.1.0"
  deployment_type: rural_edge_computing
  
location:
  town: Koya
  district: Western Rural District
  province: Western Area
  country: Sierra Leone
  timezone: Africa/Freetown
  
  coordinates:
    latitude: 8.5167
    longitude: -13.1667
  
  context:
    setting: Rural agricultural community
    population_town: 15000
    population_district: 100000
    tribal_composition: Predominantly Temne
    economy: Agriculture (cassava, rice, palm oil)
    infrastructure: Developing (mobile connectivity, limited grid power)

identity:
  operator: Pa Santige Koroma
  aka: Akil Hashim
  tribal_affiliation: Temne
  community: Koya, Western Rural District
  role: Technology bridge-builder for rural Africa
  dual_identity: true

# Business Operations
business:
  entity: Total Reality Global (Sierra Leone - Koya Operations)
  registration: Sierra Leone Corporate Affairs Commission
  principal: Pa Santige Koroma
  address: Koya, Western Rural District
  
  focus_areas:
    - Rural technology infrastructure development
    - Agricultural blockchain applications
    - Temne cultural preservation through technology
    - Youth technology education and employment
    - Regional cybersecurity solutions
    - Diaspora connection platform

  strategic_advantages:
    - Rural technology deployment model (replicable)
    - Agricultural integration opportunities
    - Traditional Temne community access
    - Cost efficiency (69% vs urban operations)
    - Infrastructure development impact
    - Enhanced grant appeal (underserved populations)

# Treasury Configuration
treasury:
  name: Temne Abara Nation
  administrator: Pa Santige Koroma
  governance: Tribal Council + Technical Oversight + Community Input
  
  allocation_rules:
    operations: 0.40
    cultural_preservation: 0.25
    community_development: 0.20
    reserve_fund: 0.15
  
  wallet:
    primary_chain: solana
    # address: [SET VIA ENV: TEMNE_TREASURY_WALLET]
    privacy_layer: midnight
  
  community_benefits:
    - Youth scholarships (Koya students)
    - Technology training stipends
    - Cultural preservation equipment
    - Agricultural cooperative support
    - Community technology center operations

# x402 Payment Protocol
x402:
  endpoint: /x402/payment
  treasury_destination: Temne Abara Nation
  settlement_chain: solana
  privacy_layer: midnight
  
  services:
    compliance_analysis:
      rate: 0.001  # NIGHT tokens per query
      currency: NIGHT
      settlement: daily
    
    multi_agent_orchestration:
      rate: 0.005
      currency: NIGHT
      settlement: per_session
    
    agricultural_supply_chain:  # NEW for Koya
      rate: 0.002
      currency: NIGHT
      settlement: weekly
      focus: Farm-to-market transparency
  
  revenue_split:
    treasury: 0.70
    operations: 0.20
    development: 0.10

# Midnight Network Configuration
midnight:
  node_id: koya-sl-001
  operator: Pa Santige Koroma / Total Reality Global
  region: west-africa-rural
  deployment_type: edge_computing
  
  services:
    - privacy_preserving_transactions
    - zk_proof_generation
    - compliance_attestation
    - cross_border_payments
    - agricultural_supply_chain_tracking  # NEW
  
  connected_nodes:
    usa: nyc-usa-001
    regional: west_africa_cluster
    
  infrastructure:
    connectivity: mobile_4g_5g
    power_source: solar_battery_backup
    offline_capable: true
    sync_frequency: hourly

# Connectivity & Infrastructure
connectivity:
  primary: 
    type: Mobile (Africell, Orange)
    speed: 4G/5G
    reliability: Moderate (intermittent)
  
  backup:
    type: Satellite (Starlink option)
    speed: Variable
    cost: $120/month
  
  power:
    primary: Solar array (5kW)
    backup: Battery bank (48hr capacity)
    tertiary: Generator (extended outages)
  
  usa_sync:
    host: nyc.totalreality.global
    port: 5000
    sync_interval: 3600  # hourly (vs 300 for urban)
    offline_queue: true
  
  cloud_deployment:
    primary: AWS Africa (Cape Town)
    fallback: Azure Africa (Johannesburg)
    edge_caching: Local Koya server
    
  influxdb:
    deployment: cloud_primary
    local_cache: true
    database: total_reality
    measurement: koya_operations
    
    tags:
      identity: pa_santige_koroma
      location: koya
      district: western_rural
      tribal_context: temne
      deployment_type: rural

# Cultural Integration
cultural:
  language: Temne
  community: Koya, Western Rural District
  knowledge_base_path: /data/temne_knowledge/koya/
  governance_model: tribal_council_community_input
  
  preservation_initiatives:
    language:
      - Temne language documentation (Koya dialect)
      - Oral history digitization (Koya elders)
      - Traditional knowledge blockchain storage
      - Youth language education programs
    
    heritage:
      - Agricultural practices documentation
      - Traditional ceremonies recording
      - Artisan skills preservation
      - Governance traditions digitization
    
    community:
      - Technology education (50+ youth annually)
      - Cultural events documentation
      - Diaspora connection platform
      - Elder-youth knowledge transfer programs

# Agricultural Integration (Koya-Specific)
agricultural:
  enabled: true
  focus: Supply chain transparency + traditional knowledge
  
  partnerships:
    - Koya Farmers Association
    - Western Rural District agricultural cooperatives
    - Sierra Leone Ministry of Agriculture
  
  pilot_projects:
    cassava_supply_chain:
      status: planning
      blockchain: midnight_network
      participants: 50+ farmers
      goal: Farm-to-market transparency
    
    traditional_farming_knowledge:
      status: planning
      focus: Temne agricultural practices
      preservation: blockchain_storage
      
    market_access:
      status: planning
      goal: Connect farmers to urban markets
      payment: x402_protocol

# Community Technology Center
community_center:
  facility:
    type: Shared community space
    size: 50-100 sq meters
    location: Central Koya
    partnership: Western Rural District Council
  
  equipment:
    servers: 2x AMD EPYC (SEV-SNP capable)
    workstations: 5-10 public access computers
    documentation_studio: Audio/video equipment
    training_space: Classroom setup (20 person capacity)
  
  programs:
    technology_training:
      duration: 12 weeks
      capacity: 20 students per cohort
      frequency: Quarterly
      stipend: $50/month per student
    
    cultural_documentation:
      focus: Oral histories, traditional practices
      equipment: Recording studio
      archive: Blockchain storage
    
    community_access:
      hours: Monday-Saturday, 8am-6pm
      services: Internet access, training, documentation
      cost: Free for Koya residents

